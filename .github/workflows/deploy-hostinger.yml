# Publica o site na Hostinger por FTP sempre que houver mudança na branch main.
# Segredos usados (Settings → Secrets and variables → Actions): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# O usuário de FTP já entra na public_html, por isso server-dir é "./".
# Envia só os arquivos que mudaram. NUNCA mexe em: config/config.php, uploads/ (fotos) e instalar.php.
name: Publicar na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:   # publicar manualmente: Actions → Publicar na Hostinger → Run workflow

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Verificar erros de sintaxe PHP (não publica se houver erro)
        run: find . -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l

      - name: Enviar por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            instalar.php
            config/config.php
            uploads/**
