; Limites do PHP para o envio de fotos grandes (até 25 MB cada).
; A Hostinger lê este arquivo; se não surtir efeito, ajuste os mesmos valores no hPanel:
; Sites → Gerenciar → Avançado → Configuração do PHP → Opções do PHP.
upload_max_filesize = 30M
post_max_size = 256M
max_file_uploads = 30
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
